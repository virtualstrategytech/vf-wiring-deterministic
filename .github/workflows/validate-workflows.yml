---
name: Validate GitHub workflows

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint (no ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Use the official container; pass args to disable ShellCheck
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.6
        with:
          args: -color -shellcheck=never


