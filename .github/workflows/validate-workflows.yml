name: Validate GitHub workflow YAML

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pure actionlint; yamllint removed to avoid non-essential failures.
      - name: actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color
