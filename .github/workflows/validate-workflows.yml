---
name: Validate GitHub workflows

"on":
  pull_request:
    paths:
      - ".github/workflows/**"

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Strict workflow validation, but without ShellCheck noise
      - name: Lint workflows (actionlint)
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          curl -sSL "https://github.com/rhysd/actionlint/releases/latest/download/actionlint_linux_amd64.tar.gz" -o "$tmpdir/actionlint.tar.gz"
          tar -C "$tmpdir" -xzf "$tmpdir/actionlint.tar.gz"
          "$tmpdir/actionlint" -color -shellcheck=never .github/workflows
        env:
          # Make output deterministic across runners/locales
          LC_ALL: C
