---
name: Validate GitHub workflow YAML

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # actionlint + shellcheck; ignore noisy rules that aren't real bugs here
      - name: actionlint (with shellcheck)
        uses: docker://rhysd/actionlint:latest
        env:
          SHELLCHECK_OPTS: -e SC1083 -e SC2027 -e SC2086
