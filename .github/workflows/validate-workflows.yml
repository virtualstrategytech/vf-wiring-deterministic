name: Validate GitHub workflows

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: Validate workflows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only actionlint, and ShellCheck explicitly disabled
      - name: Run actionlint (ShellCheck disabled)
        uses: docker://rhysd/actionlint:1.7.6
        with:
          args: -color -shellcheck=never
