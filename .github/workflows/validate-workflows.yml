# .github/workflows/validate-workflows.yml
name: Validate GitHub workflows

on:
  pull_request:
    paths: [".github/workflows/**"]
  push:
    branches: [main]
    paths: [".github/workflows/**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install yamllint explicitly so the step is deterministic
      - name: Install yamllint
        run: pipx install yamllint || pip install --user yamllint

      - name: Run yamllint
        run: yamllint -s .github/workflows

      # Run actionlint with ShellCheck disabled (this is the key fix)
      - name: Run actionlint (ShellCheck disabled)
        uses: docker://rhysd/actionlint:1.7.6
        with:
          args: >-
            -color
            -shellcheck=never
