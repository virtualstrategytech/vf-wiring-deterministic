name: Validate GitHub workflows

on:
  pull_request:
    paths: [".github/workflows/**"]
  push:
    branches: [main]
    paths: [".github/workflows/**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yamllint (deterministic)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --user yamllint==1.35.1

      - name: Run yamllint (workflows only)
        run: ~/.local/bin/yamllint -s .github/workflows

      - name: Run actionlint (ShellCheck disabled)
        uses: docker://rhysd/actionlint:1.7.6
        with:
          args: -color -format github -shellcheck=never
