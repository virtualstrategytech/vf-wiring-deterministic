name: Validate GitHub workflow YAML

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate (pull_request)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # YAML syntax/style check for workflow files
      - name: yamllint (workflows only)
        run: yamllint .github/workflows -s || echo "yamllint not installed; using actions-lint"

      # GitHub Actions workflow validator, with ShellCheck disabled
      - name: Run actionlint (ShellCheck disabled)
        uses: docker://rhysd/actionlint:1.7.6
        with:
          args: -color -shellcheck=never
