name: Detect open handles

on:
  pull_request:
    branches: [feat/wiring-agent, pr41-resolve]
  push:
    branches: [feat/wiring-agent, pr41-resolve]

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: novain-platform/webhook

jobs:
  detect-open-handles:
    name: Run tests with detectOpenHandles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: novain-platform/webhook/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Run Jest with detectOpenHandles
        run: npm test -- --ci --runInBand --detectOpenHandles
