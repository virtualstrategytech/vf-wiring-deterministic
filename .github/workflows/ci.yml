name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request: {}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Lint & test (Node 18.x)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint -- --max-warnings=0

      - name: Run tests (child-process server mode)
        env:
          USE_CHILD_PROCESS_SERVER: "1"
        run: npm test
