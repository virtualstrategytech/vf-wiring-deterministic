name: CI

on:
  pull_request: {}
  push:
    branches: [feat/wiring-agent]
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: novain-platform/webhook

jobs:
  lint:
    name: Lint (18.x)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: novain-platform/webhook/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present

  test:
    name: Test (18.x)
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: novain-platform/webhook/package-lock.json
      - run: npm ci
      - run: npm test -- --ci --runInBand
      - name: Upload Jest output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jest-output
          path: |
            tests/jest-output.txt
            artifacts/**
