name: CI Monitor - collect failed run info

on:
  workflow_run:
    workflows:
      - "CI - deployed smoke (copy)"
      - "CI - single_in_process test"
    types: [completed]

permissions:
  issues: write
  contents: read
  actions: read

jobs:
  notify-on-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write summary of failed run
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const {owner, repo} = context.repo;
            const runUrl = run.html_url || `https://github.com/${owner}/${repo}/actions/runs/${run.id}`;
            const title = `❌ CI failed: ${run.name} (#${run.run_number})`;
            const lines = [
              `Workflow: ${run.name}`,
              `Event: ${run.event}`,
              `Conclusion: ${run.conclusion}`,
              `Branch: ${run.head_branch}`,
              `Commit: ${run.head_sha}`,
              `URL: ${runUrl}`,
            ];
            core.summary.addHeading(title).addCodeBlock(lines.join("\n")).write();
