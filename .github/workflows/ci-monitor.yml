name: CI Monitor - collect failed run info

on:
  workflow_run:
    workflows:
      - CI
      - CI - child-process server tests
      - Detect open handles
    types: [completed]

permissions:
  issues: write
  contents: read

jobs:
  notify-on-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const runUrl = run.html_url || `https://github.com/${owner}/${repo}/actions/runs/${run.id}`;
            const artifacts = run.artifacts || [];
            const artifactsMd = artifacts.length
              ? artifacts.map(a => `- **${a.name}** (${a.size_in_bytes ?? 0} bytes)`).join('\n')
              : '_none_';
            const body = [
              `### CI failure: ${run.name}`,
              `- **Run**: [${run.id}](${runUrl})`,
              `- **Branch**: \`${run.head_branch}\``,
              `- **Commit**: \`${run.head_sha}\``,
              `- **Actor**: @${run.actor?.login}`,
              `- **Event**: \`${run.event}\``,
              '',
              `**Artifacts (${artifacts.length})**`,
              artifactsMd
            ].join('\n');
            await github.rest.issues.create({
              owner, repo,
              title: `CI failure: ${run.name} (${run.id})`,
              body
            });
