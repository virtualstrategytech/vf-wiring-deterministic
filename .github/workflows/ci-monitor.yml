---
name: CI Monitor - collect failed run info

on:
  workflow_run:
    workflows:
      - "CI - child-process server tests"
      - "CI - child-process server stress"
      - "CI - single_in_process test"
    types: [completed]

permissions:
  issues: write
  contents: read
  actions: read

jobs:
  notify-on-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Summarize failed run
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            core.info(`Failed workflow: ${run.name} (id=${run.id}) conclusion=${run.conclusion}`);
