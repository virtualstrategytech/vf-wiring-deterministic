---
name: CI Monitor - collect failed run info

on:
  workflow_run:
    workflows:
      - CI - child-process server tests
      - CI - single_in_process test
      - "CI - child-process server: stress"
    types: [completed]

permissions:
  issues: write
  contents: read
  actions: read

jobs:
  notify-on-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for type context)
        uses: actions/checkout@v4

      - name: Summarize failed run
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const {owner, repo} = context.repo;
            const runUrl = run.html_url || `https://github.com/${owner}/${repo}/actions/runs/${run.id}`;
            const {data} = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: run.id
            });
            const names = (data.artifacts || []).map(a => `• ${a.name} (${a.size_in_bytes} bytes)`).join('\n') || 'none';
            core.summary
              .addHeading('CI monitor: failed run')
              .addLink('Run', runUrl)
              .addCodeBlock(`id: ${run.id}\nname: ${run.name}\nhead: ${run.head_branch}@${run.head_sha}\nconclusion: ${run.conclusion}`)
              .addHeading('Artifacts')
              .addCodeBlock(names)
              .write();
