name: CI Monitor

on:
  workflow_run:
    # Use the exact display name of your main CI workflow here.
    workflows: ["CI"]
    types: [completed]

permissions:
  issues: write
  actions: read
  contents: read

jobs:
  open-issue-on-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create issue with artifact summary
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // list artifacts attached to the failed run
            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: run.id, per_page: 100
            });

            const lines = [];
            lines.push(`### CI failure: ${run.name} (run ${run.id})`);
            lines.push('');
            lines.push(`**Run**: ${run.html_url}`);
            lines.push(`**Branch**: \`${run.head_branch}\``);
            lines.push(`**Commit**: \`${run.head_sha}\``);
            lines.push('');
            if (artifacts.length) {
              lines.push('**Artifacts**');
              for (const a of artifacts) {
                lines.push(`- ${a.name} (${a.size_in_bytes} bytes)`);
              }
            } else {
              lines.push('_No artifacts collected._');
            }

            await github.rest.issues.create({
              owner, repo,
              title: `CI failure: ${run.name} (run ${run.id})`,
              body: lines.join('\n')
            });
