name: CI Monitor - collect failed run info

on:
  workflow_run:
    workflows:
      - "CI - child-process server tests"
    types:
      - completed

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  notify-on-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: GitHub Script — open an issue with run details
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const runId = run.id;
            const runUrl = run.html_url ?? `https://github.com/${owner}/${repo}/actions/runs/${runId}`;

            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: runId
            });
            const artifacts = data?.artifacts ?? [];

            const artifactsMd = artifacts.length
              ? artifacts.map(a => `- **${a.name}** (${a.size_in_bytes ?? 0} bytes)`).join('\n')
              : '_none_';

            const body = [
              `### CI failure: ${run.name}`,
              ``,
              `- **Run**: [${runId}](${runUrl})`,
              `- **Branch**: ${run.head_branch}`,
              `- **Commit**: \`${run.head_sha}\``,
              `- **Actor**: @${run.actor?.login}`,
              `- **Event**: \`${run.event}\``,
              ``,
              `**Artifacts (${artifacts.length})**`,
              artifactsMd
            ].join('\n');

            await github.rest.issues.create({
              owner,
              repo,
              title: `CI failure: ${run.name} (${runId})`,
              body
            });
