name: CI Monitor - collect failed run info

on:
  workflow_run:
    workflows:
      # These must match the workflow "name:" fields exactly
      - CI
      - CI - child-process server tests
      - CI - child-process server stress
      - CI - single_in_process test
    types:
      - completed

permissions:
  issues: write
  contents: read
  actions: read

jobs:
  notify-on-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Summarize failed run
        uses: actions/github-script@v6
        with:
          script: |
            const run = context.payload.workflow_run;
            await core.summary
              .addHeading('❌ CI Monitor: failed workflow')
              .addTable([
                ['Name', run.name],
                ['Run #', String(run.run_number)],
                ['Status', run.conclusion],
                ['Branch', run.head_branch],
                ['Commit', run.head_sha],
                ['URL', run.html_url],
              ])
              .write();
