---
name: CI - ubuntu repro

"on":
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    env:
      WEBHOOK_API_KEY: ${{ secrets.WEBHOOK_API_KEY }}
      WEBHOOK_BASE: ${{ secrets.WEBHOOK_BASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Basic smoke call
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -X POST \
            -H "content-type: application/json" \
            -H "x-api-key: $WEBHOOK_API_KEY" \
            -d '{"ping":"ok"}' \
            "$WEBHOOK_BASE/test" | head -c 200 || true


