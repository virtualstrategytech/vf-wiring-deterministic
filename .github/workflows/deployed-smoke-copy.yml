---
name: CI - deployed smoke (copy)

on:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ secrets.WEBHOOK_BASE }} # repo/org Secret
      API_KEY: ${{ secrets.WEBHOOK_API_KEY }} # repo/org Secret
    steps:
      - uses: actions/checkout@v4

      - name: Call /version
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "${BASE_URL}/version" | tee version.json

      - name: Call /status
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "x-api-key: ${API_KEY}" "${BASE_URL}/status" | tee status.json
