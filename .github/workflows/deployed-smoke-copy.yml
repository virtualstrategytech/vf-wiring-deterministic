name: CI - deployed smoke (copy)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      WEBHOOK_API_KEY: ${{ secrets.WEBHOOK_API_KEY }}
      WEBHOOK_BASE: ${{ secrets.WEBHOOK_BASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Call /version
        shell: bash
        run: |
          set -euo pipefail
          curl -sS "$WEBHOOK_BASE/version" -H "x-api-key: $WEBHOOK_API_KEY" | head -c 200 || true

      - name: Call /status
        shell: bash
        run: |
          set -euo pipefail
          curl -sS "$WEBHOOK_BASE/status" -H "x-api-key: $WEBHOOK_API_KEY" | head -c 200 ||
