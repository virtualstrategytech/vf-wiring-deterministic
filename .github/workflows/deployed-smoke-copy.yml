name: CI - deployed smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe deployed webhook
        env:
          BASE_SECRET: ${{ secrets.WEBHOOK_BASE }}
        run: |
          set -euo pipefail

          BASE="${BASE_SECRET:-}"
          if [ -z "$BASE" ]; then
            echo "::warning::WEBHOOK_BASE (secret) not set; skipping smoke."
            exit 0
          fi

          endpoints=(/health /version /status)
          for p in "${endpoints[@]}"; do
            url="${BASE}${p}"
            code="$(curl -sS -o /dev/null -w "%{http_code}" "$url" || true)"
            echo "GET ${url} -> ${code}"
            if [ "$code" != "200" ]; then
              echo "::error::Expected 200 from ${url}, got ${code}"
              exit 1
            fi
          done
