---
name: CI - single_in_process test

"on":
  pull_request:

jobs:
  single-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install deps (if present)
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          fi

      - name: Run tests (single process)
        run: |
          if [ -f package.json ]; then
            npm test --if-present
          else
            echo "No package.json Ã¢â‚¬â€œ skipping tests."
          fi

