name: CI - single_in_process test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  single-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Export secrets to env
        shell: bash
        run: |
          set -euo pipefail
          # Write to $GITHUB_ENV safely (no word splitting, no globbing)
          printf '%s\n' "WEBHOOK_API_KEY=${{ secrets.WEBHOOK_API_KEY }}" >> "$GITHUB_ENV"
          printf '%s\n' "WEBHOOK_BASE=${{ secrets.WEBHOOK_BASE }}" >> "$GITHUB_ENV"

      - name: Install deps
        run: npm ci

      - name: Run tests (single process)
        run: npm test --workspaces -- --reporters=default
