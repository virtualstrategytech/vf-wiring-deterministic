name: CI - child-process server tests

on:
  pull_request: {}
  push:
    branches: [feat/wiring-agent]
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: novain-platform/webhook

jobs:
  test-child-server:
    name: Run tests with USE_CHILD_PROCESS_SERVER=1
    runs-on: ubuntu-latest
    env:
      CI: "true"
      SKIP_SYNC_SECRET: "true"
      SKIP_BODY_PARSER: "1"
      SKIP_SMOKE: "false"
      USE_CHILD_PROCESS_SERVER: "1"
      FORCE_PER_REQUEST_AGENT: "1"
      FORCE_DETERMINISTIC_IDS: "1"
      TEST_PATCH_RAW_BODY: "1"
      JEST_OUTPUT_LOG: tests/jest-output.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: novain-platform/webhook/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test -- --ci --runInBand
      - name: Upload test logs and artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-child
          path: |
            tests/jest-output.txt
            artifacts/**
            /tmp/async_handle_map.json
            /tmp/async_handle_map*.json
            tests/async_handles_*.json
            tests/child_active_handles_*.json
