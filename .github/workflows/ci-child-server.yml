---
name: CI - child-process server tests

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      DEBUG_TESTS:
        description: 'Enable debug traces (set to "1" to enable)'
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  child-server-tests:
    name: Run tests with USE_CHILD_PROCESS_SERVER=1
    runs-on: ubuntu-latest
    env:
      CI: "true"
      SKIP_SYNC_SECRET: "true"
      SKIP_BODY_PARSER: "1"
      SKIP_SMOKE: "false"
      USE_CHILD_PROCESS_SERVER: "1"
      FORCE_PER_REQUEST_AGENT: "1"
      FORCE_DETERMINISTIC_IDS: "1"
      TEST_PATCH_RAW_BODY: "1"
      JEST_OUTPUT_LOG: tests/jest-output.txt
      DEBUG_TESTS: ${{ inputs.DEBUG_TESTS || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: novain-platform/webhook/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: bash ./scripts/ci_run_jest.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            ${{ env.JEST_OUTPUT_LOG }}
            /tmp/async_handle_map.json
            /tmp/async_handles_*.json
            tests/child_active_handles_*.json
            tests/prompt-mock.child.stdout.log
            tests/prompt-mock.child.stderr.log
            tests/globalSetup.log
            tests/prompt-mock.json
