# actionlint: disable=expr-env
name: CI - deployed smoke

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Override: base URL to probe (optional)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest

    env:
      # Default base URL from repo secret
      SECRET_BASE_URL: ${{ secrets.WEBHOOK_BASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve BASE_URL
        shell: bash
        env:
          INPUT_BASE_URL: ${{ github.event.inputs.base_url }}
          SECRET_BASE_URL: ${{ env.SECRET_BASE_URL }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_BASE_URL:-}" ]; then
            echo "Using workflow input base_url"
            BASE_URL="${INPUT_BASE_URL}"
          elif [ -n "${SECRET_BASE_URL:-}" ]; then
            echo "Using WEBHOOK_BASE secret"
            BASE_URL="${SECRET_BASE_URL}"
          else
            echo "No base URL configured (no input and WEBHOOK_BASE secret empty)" >&2
            exit 1
          fi

          # Normalize: strip trailing slash
          BASE_URL="${BASE_URL%/}"
          echo "Resolved BASE_URL=${BASE_URL}"
          echo "BASE_URL=${BASE_URL}" >> "$GITHUB_ENV"

      - name: Probe deployed health endpoint
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${BASE_URL:-}" ]; then
            echo "BASE_URL is empty; not probing" >&2
            exit 1
          fi

          TARGET="${BASE_URL}/health"
          echo "Probing: ${TARGET}"

          code="$(curl -sS -o /dev/null -w '%{http_code}' "${TARGET}")"

          if [ "${code}" != "200" ]; then
            echo "Expected 200 from ${TARGET}, got ${code}" >&2
            exit 1
          fi

          echo "Health check OK for ${TARGET}"
