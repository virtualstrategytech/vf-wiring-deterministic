---
name: CI - deployed smoke / smoke (pull_request)

"on":
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe deployed webhook
        env:
          # Prefer secret; fall back to an empty value to avoid vars context errors
          BASE_SECRET: ${{ secrets.WEBHOOK_BASE }}
          BASE_VAR: ""
          # Optional header for services that require it
          API_KEY: ${{ secrets.WEBHOOK_API_KEY }}
          # PATHS is intentionally not read from secrets here to avoid invalid context errors
          # in pull_request workflows; the script defaults to /health when PATHS is unset.
        shell: bash
        run: |
          set -euo pipefail

          BASE="${BASE_SECRET:-${BASE_VAR:-}}"
          if [[ -z "$BASE" ]]; then
            echo "::notice title=Skip smoke::WEBHOOK_BASE not set; skipping."
            exit 0
          fi

          [[ "$BASE" != http* ]] && BASE="https://${BASE}"
          BASE="${BASE%/}"

          IFS=',' read -r -a CANDIDATES <<< "${PATHS:-/health}"

          passed=0
          for raw in "${CANDIDATES[@]}"; do
            p="/${raw#/}"                  # ensure single leading slash
            url="${BASE}${p}"
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
                    -H "X-API-KEY: ${API_KEY:-}" "$url" || true)"
            echo "GET $url -> $code"
            if [[ "$code" =~ ^2[0-9]{2}$ ]]; then
              passed=1
              break
            fi
          done

          if [[ "$passed" -eq 1 ]]; then
            echo "âœ… Smoke checks passed."
          else
            echo "::error title=Smoke check failed::None of the endpoints returned 2xx"
            exit 1
          fi


