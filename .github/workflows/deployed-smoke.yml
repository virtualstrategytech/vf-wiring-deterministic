---
name: CI - deployed smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    env:
      BASE_SECRET: ${{ secrets.WEBHOOK_BASE }}
      API_KEY: ${{ secrets.WEBHOOK_API_KEY }}
      BASE_VAR: ""
    steps:
      - uses: actions/checkout@v4
      - name: Probe deployed webhook
        shell: bash
        run: |
          set -euo pipefail
          BASE="${BASE_SECRET:-$BASE_VAR}"
          if [[ -z "${BASE}" ]]; then
            echo "::notice title=Skip smoke::WEBHOOK_BASE not set; skipping."
            exit 0
          fi
          [[ "$BASE" != http* ]] && BASE="https://${BASE}"
          BASE="${BASE%/}"
          endpoints=(/status /health)
          for p in "${endpoints[@]}"; do
            url="${BASE}${p}"
            code="$(curl -sS -o /dev/null -w '%{http_code}' -H "X-API-KEY: ${API_KEY:-}" "$url" || true)"
            echo "GET $url -> $code"
            if [[ "$code" != "200" ]]; then
              echo "::error title=Smoke check failed::$url returned $code"
              exit 1
            fi
          done
          echo "✅ Smoke checks passed."
