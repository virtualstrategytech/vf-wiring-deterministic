---
name: CI - deployed smoke (copy)

on:
  pull_request:
    paths-ignore:
      - "**/*.md"

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      WEBHOOK_BASE: ${{ secrets.WEBHOOK_BASE }}
      WEBHOOK_API_KEY: ${{ secrets.WEBHOOK_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Call /version
        run: |
          set -euo pipefail
          test -n "$WEBHOOK_BASE"
          curl -fsS --retry 2 --retry-delay 2 \
            -H "Authorization: Bearer $WEBHOOK_API_KEY" \
            "$WEBHOOK_BASE/version"

      - name: Call /status
        run: |
          set -euo pipefail
          curl -fsS --retry 2 --retry-delay 2 \
            -H "Authorization: Bearer $WEBHOOK_API_KEY" \
            "$WEBHOOK_BASE/status"
