name: CI - deployed smoke / smoke

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      BASE_SECRET: ${{ secrets.WEBHOOK_BASE }} # prefer secret
      BASE_VAR: '' # optional repo/org var fallback
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe deployed webhook
        shell: bash
        run: |
          set -euo pipefail

          # Prefer secret, then var
          BASE="${BASE_SECRET:-${BASE_VAR:-}}"
          if [ -z "${BASE:-}" ]; then
            echo "::warning::WEBHOOK_BASE (secret or var) is not set. Skipping smoke."
            exit 0
          fi

          # Trim trailing slash to normalize
          BASE="${BASE%/}"

          endpoints=("/health" "/version" "/status")
          got_200=0

          for p in "${endpoints[@]}"; do
            url="${BASE}${p}"
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$url" || true)"
            echo "GET ${url#*//*/} -> ${code}"
            if [ "$code" = "200" ]; then
              got_200=1
            fi
          done

          if [ "$got_200" != "1" ]; then
            echo "::error::No endpoint returned 200"
            exit 2
          fi

      - name: Complete
        run: echo "Smoke OK"
